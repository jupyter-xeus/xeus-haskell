name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main, ghc]
  push:
    branches: [main, ghc]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          environments: native
      - run: pixi run -e native native
      - run: pixi run -e native test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          environments: wasm-build
      - uses: actions/cache@v4
        with:
          path: .cache/corresponding-source
          key: corresponding-source-${{ runner.os }}-${{ hashFiles('licenses.toml') }}
      - run: pixi run -e wasm-build test
