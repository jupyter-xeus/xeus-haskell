name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main, ghc]
  push:
    branches: [main, ghc]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          environments: native
      - run: pixi run -e native native
      - run: pixi run -e native test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          environments: wasm-build
      - name: Restore browser-test environment
        id: browser-test-cache
        uses: actions/cache/restore@v4
        with:
          path: .pixi/envs/browser-test
          key: pixi-env-browser-test-v1-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
      - name: Restore Wasm host environment
        id: wasm-host-cache
        uses: actions/cache/restore@v4
        with:
          path: .pixi/envs/wasm-host
          key: wasm-host-v1-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
      - name: Restore GHC Wasm inputs
        id: ghc-wasm-inputs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            wasm-build/_deps/ghc/downloads
            wasm-build/_deps/ghc/toolchains
            wasm-build/_deps/ghc/browser-assets
          key: ghc-wasm-inputs-v1-${{ runner.os }}-${{ hashFiles('pixi.lock', 'licenses.toml', 'xhaskell/ghc/scripts/prepare-inputs.sh') }}
      - name: Restore incremental Wasm build
        id: wasm-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            wasm-build
            !wasm-build/_deps/ghc/downloads
            !wasm-build/_deps/ghc/toolchains
            !wasm-build/_deps/ghc/browser-assets
            !wasm-build/corresponding-source
          key: wasm-build-v1-${{ runner.os }}-${{ hashFiles('pixi.lock', 'licenses.toml') }}-${{ github.sha }}
          restore-keys: |
            wasm-build-v1-${{ runner.os }}-${{ hashFiles('pixi.lock', 'licenses.toml') }}-
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
      - name: Restore corresponding-source downloads
        id: corresponding-source-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/corresponding-source
          key: corresponding-source-${{ runner.os }}-${{ hashFiles('licenses.toml') }}
      - run: pixi run -e wasm-build test
      - name: Save browser-test environment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.browser-test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pixi/envs/browser-test
          key: ${{ steps.browser-test-cache.outputs.cache-primary-key }}
      - name: Save Wasm host environment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.wasm-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pixi/envs/wasm-host
          key: ${{ steps.wasm-host-cache.outputs.cache-primary-key }}
      - name: Save GHC Wasm inputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.ghc-wasm-inputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wasm-build/_deps/ghc/downloads
            wasm-build/_deps/ghc/toolchains
            wasm-build/_deps/ghc/browser-assets
          key: ${{ steps.ghc-wasm-inputs-cache.outputs.cache-primary-key }}
      - name: Save incremental Wasm build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.wasm-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wasm-build
            !wasm-build/_deps/ghc/downloads
            !wasm-build/_deps/ghc/toolchains
            !wasm-build/_deps/ghc/browser-assets
            !wasm-build/corresponding-source
          key: ${{ steps.wasm-build-cache.outputs.cache-primary-key }}
      - name: Save Playwright Chromium
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Save corresponding-source downloads
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.corresponding-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/corresponding-source
          key: ${{ steps.corresponding-source-cache.outputs.cache-primary-key }}
