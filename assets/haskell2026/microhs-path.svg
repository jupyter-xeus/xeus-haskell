<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">MicroHs kernel execution path</title>
  <desc id="desc">A Jupyter request passes through the Xeus C++ interpreter and the MicroHs compiler API bridge into a persistent REPL context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; rx: 12; }
      .arrow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #000; text-anchor: middle; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 27px; fill: #000; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="250" fill="#fff"/>
  <rect class="box" x="25" y="70" width="240" height="100"/>
  <text class="title" x="145" y="114">Jupyter</text>
  <text class="detail" x="145" y="145">request</text>
  <path class="arrow" d="M265 120 H315"/>

  <rect class="box" x="317" y="70" width="260" height="100"/>
  <text class="title" x="447" y="114">xeus</text>
  <text class="detail" x="447" y="145">C++</text>
  <path class="arrow" d="M577 120 H627"/>

  <rect class="box" x="629" y="70" width="260" height="100"/>
  <text class="title" x="759" y="106">MicroHs</text>
  <text class="detail" x="759" y="139">compiler API</text>
  <path class="arrow" d="M889 120 H939"/>

  <rect class="box" x="941" y="70" width="234" height="100"/>
  <text class="title" x="1058" y="110">ReplCtx</text>
  <text class="detail" x="1058" y="143">persistent</text>
</svg>
