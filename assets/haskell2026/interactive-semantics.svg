<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Interactive semantics of a Haskell notebook cell</title>
  <desc id="desc">A notebook cell transforms a typed environment and runtime state. Pure declarations extend the environment, expressions are typed before evaluation, and IO actions sequence effects through the runtime state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; rx: 12; }
      .arrow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 700; fill: #000; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 28px; fill: #000; text-anchor: middle; }
      .math { font-family: Georgia, "Times New Roman", serif; font-size: 34px; font-style: italic; fill: #000; text-anchor: middle; }
      .edge { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #000; text-anchor: middle; }
      .banner { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #fff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="610" fill="#fff"/>

  <rect class="box" x="45" y="34" width="340" height="150"/>
  <text class="heading" x="215" y="75">State n</text>
  <text class="math" x="215" y="116">Γₙ  types</text>
  <text class="math" x="215" y="154">σₙ  effects</text>

  <path class="arrow" d="M385 109 H815"/>
  <text class="edge" x="600" y="82">cell cₙ</text>
  <text class="label" x="600" y="142">result rₙ</text>

  <rect class="box" x="815" y="34" width="340" height="150"/>
  <text class="heading" x="985" y="75">State n + 1</text>
  <text class="math" x="985" y="116">Γₙ₊₁  types</text>
  <text class="math" x="985" y="154">σₙ₊₁  effects</text>

  <rect class="box" x="35" y="250" width="350" height="190"/>
  <text class="heading" x="210" y="296">Pure declarations</text>
  <text class="math" x="210" y="342">Γₙ₊₁ = Γₙ, x : τ</text>
  <text class="math" x="210" y="382">σₙ₊₁ = σₙ</text>
  <text class="label" x="210" y="416">types only</text>

  <rect class="box" x="425" y="250" width="350" height="190"/>
  <text class="heading" x="600" y="296">Expressions</text>
  <text class="math" x="600" y="342">Γₙ ⊢ e : τ</text>
  <text class="math" x="600" y="382">e ⇓ v</text>
  <text class="label" x="600" y="416">type, then evaluate</text>

  <rect class="box" x="815" y="250" width="350" height="190"/>
  <text class="heading" x="990" y="296">Effects</text>
  <text class="math" x="990" y="342">m : IO a</text>
  <text class="math" x="990" y="382">σₙ ⟶ σₙ₊₁</text>
  <text class="label" x="990" y="416">sequenced</text>

  <rect x="35" y="500" width="1130" height="76" fill="#000" rx="12"/>
  <text class="banner" x="600" y="547">Model: successful cells transform persistent notebook state</text>
</svg>
