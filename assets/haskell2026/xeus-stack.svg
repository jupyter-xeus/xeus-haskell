<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Xeus architecture</title>
  <desc id="desc">Jupyter client connects through a server and the Xeus kernel core to a language-specific interpreter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; rx: 12; }
      .arrow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #000; text-anchor: middle; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 30px; fill: #000; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fff"/>
  <rect class="box" x="300" y="20" width="600" height="82"/>
  <text class="title" x="600" y="70">Jupyter client</text>

  <path class="arrow" d="M600 102 V138"/>
  <rect class="box" x="220" y="140" width="760" height="92"/>
  <text class="title" x="600" y="180">Server</text>
  <text class="detail" x="600" y="214">ZeroMQ · browser memory</text>

  <path class="arrow" d="M600 232 V268"/>
  <rect class="box" x="220" y="270" width="760" height="92"/>
  <text class="title" x="600" y="310">Xeus kernel core</text>
  <text class="detail" x="600" y="344">messages · lifecycle</text>

  <path class="arrow" d="M600 362 V398"/>
  <rect class="box" x="220" y="400" width="760" height="92"/>
  <text class="title" x="600" y="440">Language interpreter</text>
  <text class="detail" x="600" y="474">execute · complete · inspect</text>
</svg>
