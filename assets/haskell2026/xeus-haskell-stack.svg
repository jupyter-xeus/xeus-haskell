<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Xeus-Haskell execution stack</title>
  <desc id="desc">The Jupyter frontend communicates through Xeus to a Haskell backend implemented by either MicroHs or persistent GHC Wasm.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; rx: 12; }
      .arrow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .line { fill: none; stroke: #000; stroke-width: 3; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 42px; font-weight: 700; fill: #000; text-anchor: middle; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 29px; fill: #000; text-anchor: middle; }
      .edge { font-family: Arial, Helvetica, sans-serif; font-size: 27px; fill: #000; text-anchor: start; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <rect class="box" x="350" y="18" width="500" height="72"/>
  <text class="title" x="600" y="63">Jupyter frontend</text>

  <path class="arrow" d="M600 90 V140"/>
  <text class="edge" x="620" y="122">messages</text>
  <rect class="box" x="350" y="142" width="500" height="72"/>
  <text class="title" x="600" y="187">xeus / xeus-lite</text>

  <path class="arrow" d="M600 214 V264"/>
  <text class="edge" x="620" y="246">xinterpreter</text>
  <rect class="box" x="350" y="266" width="500" height="72"/>
  <text class="title" x="600" y="311">Haskell backend</text>

  <path class="line" d="M600 338 V390 M300 390 H900"/>
  <path class="arrow" d="M300 390 V438"/>
  <path class="arrow" d="M900 390 V438"/>

  <rect class="box" x="95" y="440" width="410" height="92"/>
  <text class="title" x="300" y="480">MicroHs</text>
  <text class="detail" x="300" y="512">native and browser</text>

  <rect class="box" x="695" y="440" width="410" height="92"/>
  <text class="title" x="900" y="480">GHC Wasm</text>
  <text class="detail" x="900" y="512">browser</text>
</svg>
