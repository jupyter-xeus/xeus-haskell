<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Modular path from a Haskell implementation to JupyterLite</title>
  <desc id="desc">A Haskell compiler, interpreter, or runtime connects through a small JavaScript and JSON bridge to xeus-lite and then JupyterLite.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; rx: 12; }
      .arrow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 35px; font-weight: 700; fill: #000; text-anchor: middle; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 27px; fill: #000; text-anchor: middle; }
      .api { font-family: "Courier New", monospace; font-size: 32px; fill: #000; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#fff"/>

  <rect class="box" x="20" y="42" width="250" height="135"/>
  <text class="heading" x="145" y="99">Your runtime</text>
  <text class="detail" x="145" y="140">compiler · REPL</text>

  <path class="arrow" d="M270 110 H315"/>

  <rect class="box" x="317" y="42" width="250" height="135"/>
  <text class="heading" x="442" y="91">Stable bridge</text>
  <text class="detail" x="442" y="140">JS · JSON · Wasm</text>

  <path class="arrow" d="M567 110 H612"/>

  <rect class="box" x="614" y="42" width="250" height="135"/>
  <text class="heading" x="739" y="91">xeus-lite</text>
  <text class="detail" x="739" y="140">Jupyter kernel</text>

  <path class="arrow" d="M864 110 H909"/>

  <rect class="box" x="911" y="42" width="269" height="135"/>
  <text class="heading" x="1045" y="91">JupyterLite</text>
  <text class="detail" x="1045" y="140">browser notebooks</text>

  <rect class="box" x="170" y="220" width="860" height="70"/>
  <text class="api" x="600" y="264">execute · complete · inspect · display</text>
</svg>
